name: GitHub Trending 每日解读
on:
  schedule:
    # cron 用的是 UTC 时间。19:30 UTC = 墨尔本 AEST(UTC+10) 次日 05:30
    # 注意：墨尔本夏令时(10月初~4月初, AEDT=UTC+11)期间，这个时间会变成当地 06:30
    # 夏令时期间想保持 05:30，需改成 '30 18 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:   # 允许在网页上手动点一下就跑，方便测试
permissions:
  contents: read
  issues: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成日期标签（issue 标题和邮件标题共用）
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 40
            --allowedTools "WebFetch,Read,Write,Bash(gh issue create:*),Bash(date:*),Bash(cat:*)"
          prompt: |
            你要生成一份 GitHub Trending 的每日中文解读，读者是一名 **AI Agent 方向的入门学习者, 你不能刻意炫自己的理论水平有多高，而是较为详细地带着读者理解项目，提高技术水平**。
            ## 步骤
            1. 用 WebFetch 抓取 https://github.com/trending （Today、全部语言），
               提取**前三名**仓库的：全名（owner/repo）、主语言、总 star 数、今日新增 star 数、官方一句话描述。
            2. 对这三个仓库，分别抓取它们的 README 来真正理解项目内容：
               先试 https://raw.githubusercontent.com/<owner>/<repo>/main/README.md ，
               404 就再试 master 分支。抓不到就退回用仓库主页。
            3. 写一份 Markdown 解读，结构如下：
               - **前三名总览**：一个表格（排名 / 项目链接 / 语言 / stars / 今日新增 / 一句话），
                 表格后面用两三句话点出今天这三个项目**共同反映出什么趋势**。
               - **第 2 名、第 3 名**：各一小节，说清楚它解决什么问题、怎么解决的，
                 以及**对 Agent 入门者的启发**（列 2-4 条）。
               - **第 1 名详解**（这是重点，占全文一半以上篇幅）：
                 * 它到底是什么、怎么用（给出真实命令）
                 * 为什么今天能冲到第一（它相比已有方案好在哪）
                 * **架构拆解**：把它的实现拆成几个模块讲
                 * 每讲到一个 AI Agent 的通用知识点，就用引用块单独标注出来解释，例如：
                   > 📌 **知识点：Tool Use / Function Calling**
                   > （解释这个概念是什么、为什么重要、入门者该怎么理解）
                   常见可展开的点：工具调用、沙箱隔离、ReAct 循环、多 Agent 编排、
                   上下文工程、MCP、验证闭环、token 成本控制等——但只写这个项目**真正涉及**的，不要硬凑。
                 * 最后给一段「如果我要照着它学，该按什么顺序学」的建议
               - **结尾**：一个三列对比表，把三个项目放在一起看。
            4. 把这份 Markdown 用 gh CLI 发布成本仓库的一个 issue：
               gh issue create --title "GitHub Trending 解读 · $(date -u +%Y-%m-%d)" --body-file <文件路径>
               先把正文用 Write 工具写到 /tmp/digest.md，再用 --body-file 引用，避免转义问题。
            ## 要求
            - 全文中文。
            - 内容必须具体：给真实命令、真实数字、真实结论。禁止写「这体现了 AI 的强大」这类空话。
            - 如果某个项目和 AI Agent 完全无关（比如是个字体库），照样如实介绍，
              但把「对 Agent 入门者的启发」换成一句诚实的说明，不要强行关联。
            - 只做上面这些事。不要修改仓库里的任何文件，不要提交代码，不要开 PR。

      - name: 生成邮件正文（Markdown → HTML）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
          cp /tmp/digest.md "$GITHUB_WORKSPACE/digest.md"
          pandoc -f gfm -t html "$GITHUB_WORKSPACE/digest.md" -o "$GITHUB_WORKSPACE/digest.html"

      - name: 通过 Resend API 发送邮件
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          jq -n \
            --arg from "GitHub Trending Bot <onboarding@resend.dev>" \
            --arg to "brucelelele2000@outlook.com" \
            --arg subject "GitHub Trending 解读 · ${{ steps.date.outputs.value }}" \
            --rawfile html "$GITHUB_WORKSPACE/digest.html" \
            '{from:$from, to:[$to], subject:$subject, html:$html}' > /tmp/resend_payload.json

          http_status=$(curl -sS -o /tmp/resend_response.json -w '%{http_code}' \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            -d @/tmp/resend_payload.json)

          cat /tmp/resend_response.json
          if [ "$http_status" -ge 300 ]; then
            echo "Resend 返回了非成功状态码: $http_status"
            exit 1
          fi
